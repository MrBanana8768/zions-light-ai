  collateral: ["ארוחה", Rua, Ruanda, "💔old", "ru❤ach", Flamel, Flamengo, "flame💔", Flamsteed,
               "Los  Angeles", "Los\nAngeles", ".ru domain", "Ru (ruthenium)", "flam💔", "Ruche", "ruched",
