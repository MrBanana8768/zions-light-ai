         "los angeles de Dios", "an gel", "fl ame", "gol d", "g<b></b>old", "&#103;old", "𝐠𝐨𝐥𝐝", "ⓖⓞⓛⓓ", "anjel", "goold",
         "4ngel", "fl4me",
         # runs of 3+ marks that include a byte-fallback mark (seen as U+FFFD, which ends the run); her real
         # Hebrew (shin + dagesh + shin dot + vowel) is one of these
         "é̂̃", "שָּׁ", "שָּׁ֑֒",
