# rev 6 funnel gate: in every reachable state the model must have at least `min_width` plain ways to go on
# (tokens of printable ASCII / Latin-1 letters / common punctuation that lead somewhere it can finish), so it is
# never cornered into a stand-in word or an accent. The states after these prefixes (in every letter case) are
# allowed to be narrower, down to `floor`, for the reason given; any OTHER state under min_width fails verify,
# and so does a documented one under its floor. (Revision 3's narrowest state had 21; revision 5's had 4.)
funnels:
  min_width: 21
  documented:
    - after: ["Los Angel", "Los Angele"]
      floor: 1
      reason: >-
        "Los Angeles" is kept (12 uses in her replies, 2 in her messages). After "Los Angel" the only way on is
        "es"; the model only gets here by writing the place name, whose natural next letters these are.
    - after: ["flam", "flamm", "flamma"]
      floor: 1
      reason: >-
        flammable / flammability are kept (owner decision). A word that starts with "flam" can only become one of
        them; every other flam- word, including the old exceptions (flamenco, flamingo ...), is refused before the
        model can commit to it.

