# The word ban, declared. `wordban.py build` turns this file into the xgrammar grammar that is pasted into
# the model's `structured_outputs` custom parameter in OpenWebUI. See README.md for the pattern syntax and the
# workflow (build -> verify -> e2e -> release). Adding a word is usually one line under `families:`.
#
# Letters in a pattern are FOLDED and case-insensitive: every Latin letter whose compatibility decomposition is
# one ASCII letter counts as that letter (á à â ä ā ă ą ǎ ạ ... -> a, ñ -> n, fullwidth Ｇ -> G), plus the
# `extra` table below; Greek letters fold their accents and breathings (ἄ ά Ά -> α). Combining marks are
# transparent (r + U+0301 + uach = ruach). Any Unicode letter continues a word; a non-letter ends it; a
# lower-case letter followed by an upper-case one also starts a new word (camelCase: "ThisAngel").
revision: 8
# rev 7 FINAL (coordinator): the revision actually PASTED on prod right now - the owner updates this field by
# hand after each real paste (Step 1 of the release report), so it can lag `revision:` by any number of
# revisions that were built but never pasted (v6 is exactly that case: built, released as a file, never
# pasted). `diff`'s and `cycle`'s "what changed" default to comparing against THIS, not `revision - 1`, so the
# default answer is always "what changed vs what she is actually seeing" - `--base-release` still overrides it.
# rev 8 (coordinator, 2026-09-25): kept at 5, unchanged - the owner has not confirmed pasting v7 yet, so v5 is
# still what she is actually seeing. Bump this by hand once v7 (or v8) is actually pasted.
live_revision: 5
model: coder3101/Cydonia-24B-v4.3-vision-heretic
# The grammar depends on the Unicode tables of the Python that builds it. The image's vLLM venv and the
# unit-test image both have Unicode 15.0.0; `build` re-runs itself inside the image when the local Python differs.
unicode_version: "15.0.0"
# Published revisions that must never be pasted again (`release` leaves them out of the rollback advice).
withdrawn_revisions:
  4: "it traps the model. After 'angel' plus an accented letter (angelĂ, Angelø, angeléñÖs), only combining marks are allowed and the reply cannot end (live 2026-09-23, 5 replies)."

# rev 7 hostile-review fix 7: KEYED BY REVISION (was a single string) - a caveat on the release BEFORE the
# immediately-previous one, for `release`'s Rollback paragraph (see render_report in wb_cmds.py) - "Paste
# ...v6.txt (or v5, which lacks the yellow-light ban) into the row ... Never v4." Filled in by hand for each
# revision, keyed by the revision the note applies to (the CURRENT revision when it was written); `release`
# REFUSES (before writing anything) if the current revision has no entry here. "Never vN" (withdrawn_revisions
# above) is added on top of this, unconditionally.
rollback:
  6: "v5, which lacks the yellow-light ban"
  # rev 7 FINAL (hostile-review fix 1, HIGH): prod runs v5 right now - v6 was BUILT but never pasted onto the
  # model (memory.md), so it is not a live rollback target at all; v5 is. v6, if anyone does have it, is
  # LOOSER than v7, not stricter: v6's YELLOWLIGHT rule was `other: allow, ban_words: ["s"]` - it let "yellow
  # lighthouse"/"yellow lighting"/"yellow lighter" etc through, banning only the literal "s" continuation
  # ("yellow lights"). v7 (this revision) is the first with a complete, unconditional ban on every
  # "yellow light..." word (owner decision D1).
  7: "`word-ban-structured_outputs.value.v5.txt` (what prod runs now; it has no yellow-light ban at all - not v6, which was built but never pasted, and is in any case LOOSER than v7, not stricter: it let yellow lighthouse/lighting/lighter through; only rev 7 bans them unconditionally)"
  # rev 8 (coordinator, 2026-09-25): the primary target is v7, since that is the NEXT release below this one -
  # but the owner has NOT confirmed pasting v7 either (live_revision: is still 5), so v7 may be exactly as
  # un-pasted as v6 was. Said plainly: if v7 was never pasted, roll back to v5 instead (it is what is actually
  # live) - v7 itself has no "white" ban and no rev-8 grammar fixes, but is otherwise a strict superset of v5's
  # protections (the yellow-light joined-phrase ban), so it is safe either way; v6 is looser than both (see the
  # rev-7 note above) and should not be used.
  8: "`word-ban-structured_outputs.value.v7.txt` (the next release below this one) - BUT check first whether v7 was ever actually pasted (see live_revision: above, still 5 as of this revision): if it was NOT, paste `word-ban-structured_outputs.value.v5.txt` instead (what is actually live). Never v6 (looser than both - see rollback[7])."

folding:
  latin_blocks: [[0x00C0, 0x024F], [0x1E00, 0x1EFF], [0xFF21, 0xFF5A]]
  greek_blocks: [[0x0370, 0x03FF], [0x1F00, 0x1FFF]]
  extra: {"ø": o, "Ø": O, "ł": l, "Ł": L, "đ": d, "Đ": D, "ð": d, "Ð": D, "ħ": h, "Ħ": H, "ı": i, "ŀ": l,
          "Ŀ": L, "ƚ": l, "ɗ": d, "Ɗ": D, "ɠ": g, "Ɠ": G, "ƈ": c, "Ƈ": C, "ȼ": c, "Ȼ": C, "ɍ": r, "Ɍ": R,
          "ɇ": e, "Ɇ": E, "ȡ": d, "ʉ": u, "Ʉ": U, "ǥ": g, "Ǥ": G, "ɨ": i, "Ɨ": I}
  # After a banned stem, an ACCENTED form of a letter that an allowed continuation reads (Angelâ, flamé,
  # angeléñÖs) is simply not allowed: the model must write a different word. ('taint' = the revision-4
  # behaviour that trapped the model in combining marks; it exists only so the tests can rebuild that trap.)
  accented_continuation: dead
  # vLLM hands xgrammar the Tekken vocabulary as decoded strings, so a byte-fallback token (a character the
  # vocabulary has no whole token for) reaches the grammar as U+FFFD. In letter-only rules ONE run of U+FFFD
  # per word may stand for one letter or an unseen accent (Ŕuach, gȍld). Right after a banned stem it is refused.
  fffd: one_run_per_word
  # Zalgo guard: at most 2 combining marks in a row after any base character. Only whole-token marks are
  # seen as marks (154 single-mark tokens in Tekken; 4 of them Hebrew: sheva, patah, qamats, dagesh); every
  # other mark arrives as U+FFFD, which ends the run. Her Hebrew uses 3-mark clusters, but each includes a
  # shin/sin dot (byte fallback), so at token level none exceeds 2. (mark_cap_hebrew: N with hebrew_marks:
  # [[0x0591, 0x05C7]] would allow N Hebrew points in a row, at about +50 % first-compile time.)
  mark_cap: 2
  mark_cap_hebrew: null
  # rev 6: right after a banned stem (inside the continuation of an exception, e.g. "Los Angel|es", "flam|mable")
  # and inside a plain-letters-only stem, no combining mark at all: a mark there only serves an accent evasion,
  # and it was 208 of the ~212 tokens the model could pick in revision 5's narrowest states.
  marks_after_stem: refuse
  # rev 6: look-alike letters from other scripts count as the Latin letter they look like, inside the banned
  # patterns (gоld with a Cyrillic о, ΑNGEL with a Greek Α). Only mixed-script words can be affected: no Cyrillic or
  # Greek word can spell a banned stem with these alone.
  # rev 7: audited against every letter actually used by a banned pattern (r,u,a,c,h,n,g,e,l,o,d,f,m,y,w,i,t - see
  # families below). Added: lowercase Greek α (owner decision); ι/η/ν/μ/τ (Greek lowercase for i/h/n/m/t: no
  # lowercase entry existed although the uppercase one did, or the letter is used and had no Greek entry at all);
  # Cyrillic uppercase У/Ԁ (a lowercase entry already existed for y/d but not its uppercase pair). No entry was
  # added for r, u, or f: no standard single-codepoint Cyrillic or Greek look-alike exists for them.
  # rev 8 hostile-review fix 1: added h/w look-alikes, audited for the new "white" family (w,h,i,t,e) - Cyrillic
  # һ/Һ (U+04BB/U+04BA, "shha") for h; Cyrillic ԝ/Ԝ (U+051D/U+051C, "wa" - used in some Cyrillic-alphabet
  # languages) and IPA/phonetic ᴡ (U+1D21, small capital w) for w; IPA/phonetic ʜ (U+029C, small capital h) for h.
  confusables: {"а": a, "е": e, "о": o, "р": p, "с": c, "у": y, "х": x, "і": i, "ј": j, "ԁ": d, "ӏ": l, "ɡ": g,
                "А": A, "В": B, "Е": E, "К": K, "М": M, "Н": H, "О": O, "Р": P, "С": C, "Т": T, "Х": X, "І": I,
                "Ј": J, "У": Y, "Ԁ": D, "Α": A, "Β": B, "Ε": E, "Η": H, "Ι": I, "Κ": K, "Μ": M, "Ν": N, "Ο": O,
                "Ρ": P, "Τ": T, "Χ": X, "Υ": Y, "Ζ": Z, "ο": o, "α": a, "ι": i, "η": h, "ν": n, "μ": m, "τ": t,
                "һ": h, "Һ": H, "ԝ": w, "Ԝ": W, "ᴡ": w, "ʜ": h}
  # rev 6: characters that stand in for a letter of a banned pattern (angeI / goId with a capital i, ange1, g0ld)
  # rev 7 hostile-review fix 2: audited against every letter actually used by the banned patterns (same audit as
  # the confusables table above) - added ɑ (U+0251, Latin small letter alpha) for "a" (angel, flame
  # all use it; outside folder.fold's latin_blocks range, 0x0250-0x02AF is IPA Extensions, not 00C0-024F) and
  # ʟ (U+029F, Latin letter small capital L) for "l" (angel, gold, flame, yellow_light all use it).
  lookalikes: {l: ["I", "1", "|", "ʟ"], o: ["0"], a: ["ɑ"]}
  # rev 6: invisible characters that split a word without showing (soft hyphen, zero-width space and non-joiner,
  # word joiner, zero-width no-break space) are refused everywhere. Her replies used a soft hyphen only in 2
  # decoration runs (after a quote mark), never inside a word.
  forbidden_chars: [0x00AD, 0x200B, 0x200C, 0x2060, 0xFEFF]
  # rev 6: a zero-width joiner may not touch a letter (it is kept for emoji sequences: 👨‍👩‍👧, ❤️‍🔥, 🏳️‍🌈)
  zwj_not_between_letters: true

# named separator sets for {SEP:NAME}; "WS" = any whitespace character except the plain space (newline, tab,
# NBSP, thin spaces ...)
# rev 7: added U+2010 (hyphen), U+2011 (non-breaking hyphen) and U+2212 (minus sign) - all look like "-" - to
# every general-purpose set that already carries a plain hyphen. ':' ',' '+' were tried in R/ALL/SPLIT
# (`wordban.py diff` against her corpus, counts only, plus the listed test strings) one set at a time: 0
# newly-blocked corpus occurrences and no listed test changed - kept (ALL already carried ',' before rev 7).
# rev 7 fix 1: "WS" (tab, newline, NBSP ... - see WS_EXTRA in wb_core.py) was removed from SPLIT again - it
# turned ordinary abbreviations ("e.g.\told") into false blocks. SP stays space-only by design (see below).
# rev 7 FINAL: the yellow_light phrase family has its OWN separator sets now (PJOIN/PSPLIT/NL, below) rather
# than reusing a shared "WF" set - PJOIN deliberately excludes ':' ',' (their own glued-only literal rule
# instead - see families.yellow_light) so that ": "/", " (sentence punctuation + space, a BREAK) stay unmatched.
separators:
  R: [" ", "-", "‐", "‑", "−", "'", "’", "_", ".", ":", ",", "+"]
  # a run of these between EVERY letter (a-n-g-e-l, g · o · l · d, "g, o, l, d", "g\told")
  ALL: [" ", "-", "‐", "‑", "−", ".", "_", "*", "·", "•", "/", "–", "—", ",", "|", "WS", ":", "+"]
  # a run of these at ONE place inside the word (an-gel, fl·ame, **G**old, `g`old); no space: "an gel(atin)"
  # rev 7 hostile-review fix 1: 'WS' removed - it used to include tab/newline (added in the rev 7 draft), which
  # made "e.g.\told" / "e.g.\nold" / "100 g\nold" read as a split "gold" (false blocks). Plain space was never a
  # member here by design (see SP below); NBSP/narrow NBSP are also never in-word SPLIT characters for the
  # SAME reason - they behave exactly like a plain space (see NBSP_MIRROR in wb_core.py), and plain space isn't
  # a SPLIT member either. ':' ',' '+' stay - they only combine with the OTHER literal members of this set
  # (never with whitespace, since none is left here), so "g:old"/"g,old" stay banned and "e.g.: old" (space,
  # not a SPLIT member) still passes.
  SPLIT: ["-", "‐", "‑", "−", "'", "’", "_", ".", "*", "(", ")", "·", "•", "/", "–", "—", "`", "~", "|",
          ":", ",", "+"]
  # gold also split by spaces alone (g old, go ld, gol d): 0 occurrences in her corpus. Spaces are kept out of
  # the mixed runs above so that "e.g. old" still passes. Left space-only (no WS, no new punctuation): a gold
  # split by a stray tab/newline/colon/comma/plus has never occurred, and the rule's own no-false-block guarantee
  # for "200 g old" (rev 7, `not_after` below) depends on the set staying just the plain space. (rev 7 fix 1:
  # NBSP/narrow NBSP are folded into every set that carries a plain space, so SP now also accepts them.)
  SP: [" "]
  # a bare single line break only - never combined with anything else, never starred alongside other characters,
  # so a run of 2+ (a blank line) never matches through this set (see the PJOIN comment: the same reasoning).
  NL: ["\n"]
  # rev 7 (owner decisions A/B): yellow_light's OWN separators.
  # PJOIN: a run of these GLUES the two words of the phrase (banned) - space/NBSP/narrow-NBSP (via the 'space'
  # auto-mirror)/tab/other exotic whitespace (WS), hyphen/dash/minus variants, underscore, slash, middle dot,
  # bullet, tilde, pipe, backtick and asterisk (markup: "**yellow** light"). A run may mix these freely ("yellow
  # - light", "yellow_-_light"). Deliberately EXCLUDES: '.' ':' ',' (their own single-character, no-space rule
  # below - so "yellow. light"/"yellow: lighter"/"yellow, light" (BREAK, sentence punctuation + space) stay
  # unmatched and PASS, while "yellow.light" (no space) is still banned); '+' (only " + " is explicitly a BREAK
  # exemption - "Yellow + light = cream" - so '+' is not offered as a phrase separator at all here); and the
  # bare newline (its own dedicated single-line-break rule below, so a blank line or a line broken by
  # punctuation/a list marker is never swept up by a `*` run of this set).
  # rev 7 FINAL (item 4): added the remaining common dash code points - U+2015 HORIZONTAL BAR ("―", the review's
  # own missed form), U+FE58 SMALL EM DASH, U+FE63 SMALL HYPHEN-MINUS, U+FF0D FULLWIDTH HYPHEN-MINUS.
  # rev 7 FINAL (targeted review, D2 completion): added the quote/bracket/brace characters that were still
  # missing - straight and curly double quotes (" “ ”), the remaining curly single quote (‘ - ’ was already
  # here), and both bracket pairs ([ ] { }) - "yellow" light / [yellow] light / {yellow} light etc. must be
  # JOINED (banned) exactly like the parens already were.
  PJOIN: [" ", "-", "‐", "‑", "−", "–", "—", "―", "﹘", "﹣", "－", "_", "/", "·", "•", "~", "|", "`", "*", "WS",
          "'", "’", "‘", "(", ")", "\"", "“", "”", "[", "]", "{", "}"]
  # PSPLIT: a split INSIDE either word of the phrase ("yel-low light", "yellow lig-ht", "yel low light" - a
  # space inside "yellow"/"light" is fine to ban for THIS phrase specifically, owner decision A - unlike the
  # generic angel/gold SPLIT set, which excludes space to avoid blocking "an gelato"). SPLIT's own members plus
  # a plain space (which, via the auto-mirror, also plainly means NBSP/narrow NBSP).
  PSPLIT: ["-", "‐", "‑", "−", "'", "’", "_", ".", "*", "(", ")", "·", "•", "/", "–", "—", "`", "~", "|",
           ":", ",", "+", " "]
  # Hebrew: inside the word (רו״ח, ר-וח) and between every letter (ר ו ח) - untouched (Hebrew-specific; the new
  # characters above are Latin-script punctuation with no bearing on Hebrew splits)
  H: ["-", "־", "״", "׳", "'", "\"", "·", ".", "*"]
  HSP: [" ", "-", "־", "״", "׳", "'", "\"", "·", ".", "*"]

# Pattern syntax:  letters (folded, any case) | {L} any one letter | {L?} optionally one letter |
#   {SEP:X} one character of separator set X | {SEP:X}* any run of them (or none) | [01l] one of these
#   characters (letters inside are folded) | any other character is literal.
# A rule is either  match: <pattern>  (banned outright)  or  stem: <pattern>  with a continuation policy:
#   alone:  ban|allow   the stem as a whole word
#   other:  ban|allow   the stem followed by letters not listed below
#   allow_words:    whole words (stem + these letters, then a non-letter) that are allowed, plain letters only
#   allow_prefixes: stem + these letters starts a different, allowed word (anything may follow)
#   context: {after: <pattern>, plain: true, allow_words: [...]}  when the word directly follows <pattern>,
#                   the rule becomes a stem with these allowed endings (spelled in plain ASCII letters only)
#   allow_in_words: [...]  a word that BEGINS with one of these (complete by the end of the banned letters) is
#                   exempt: evangel(ical), strangel(y), marigold, inflam(mation)
# where: word_start (default) | anywhere | inside (not at a word start).
# spaced: X = a run of set X between every letter.   split: X = a run of set X at one place inside the word.
# fffd: false | true (one U+FFFD run may be a letter or an accent) | transparent (U+FFFD runs are skipped).
families:
  ruach:
    rules:
      - {id: RUACH, match: ruach, where: anywhere}
      - {id: RUA, match: rua}                              # Ruah, Ruac, Ruauch, Ruarch, Ruaach
      - {id: "RU?ACH", match: "ru{L}ach"}                  # Rurach, Ruuach, Rubach
      - {id: "RU'ACH", match: "ru{SEP:R}ach"}
      - {id: R-U-A-C-H, match: ruach, spaced: ALL}
      - {id: "RU?CH", match: "ru{L?}ch"}                   # rev 5: Ruch, Ruich, Ruuch, Rucha (stand-ins seen live)
      - {id: RU, stem: ru, alone: ban, other: allow}       # the word "Ru"/"RU" on its own; rue, run, ruby pass
      # rev 6: points the tokenizer has no whole token for arrive as U+FFFD: skipped (רוֹח, רׁוח)
      - {id: HEBREW, match: "רוח", where: anywhere, fffd: transparent}
      - {id: HEBREW-SPLIT, match: "רוח", split: H, where: anywhere, fffd: transparent}     # rev 6: רו״ח, ר-וח
      - {id: HEBREW-SPACED, match: "רוח", spaced: HSP, where: anywhere, fffd: transparent} # rev 6: ר ו ח, ר-ו-ח
  angel:
    rules:
      # rev 6: banned anywhere in a word (theangel, guardianangel), except inside these real words; no name
      # exceptions any more (Angela, Angeleno(s): 0 uses; they only cornered the model after "angel"); "Angeles" only
      # in "Los Angeles", in plain letters (not "los ángeles")
      - {id: ANGEL, match: angel, where: anywhere,
         allow_in_words: [evangel, strangel, changel, michelangel, mangel],
         context: {after: "los ", plain: true, allow_words: [es]}}
      - {id: A-N-G-E-L, match: angel, spaced: ALL}
      - {id: AN.GEL, match: angel, split: SPLIT}           # rev 6: an-gel, ang·el, **An**gel
      - {id: AGGEL, match: aggel}                          # rev 5: aggelos (Greek transliteration)
      - {id: GREEK-ANGEL, match: "αγγελ"}                   # rev 5: άγγελος, ἄγγελος, ΑΓΓΕΛΟΣ
      - {id: GREEK-ARCHANGEL, match: "αρχαγγελ"}          # rev 6: word start (ευαγγέλιο, "gospel", must pass)
  gold:
    rules:
      - {id: GOLD, match: gold, where: anywhere, allow_in_words: [marigold]}   # rev 6: puregold, whitegold
      - {id: G-O-L-D, match: gold, spaced: ALL}
      - {id: G0LD, match: "g0[l1]d"}
      - {id: GO1D, match: "go1d"}
      - {id: GO.LD, match: gold, split: SPLIT}             # g-old, go·ld, gol'd, g(old, **G**old
      # rev 7: not_after (a rule-level negative lookback, see wb_core.py) - a "g"/"go" directly preceded by a
      # digit (glued: "100g", or with a run of spaces: "200  g") is the mass unit, not the start of a split
      # "gold" evasion. "200 g old-fashioned oats" / "100g old bread" / "2 go ld" must pass; confirmed 0 real
      # "g old"/"go ld" gold evasions in her corpus either way (rev 6's own note: 0 occurrences). Two
      # `{SEP:SP?}` in a row (not a bare `{SEP:SP}*` - a not_after marker pattern can never end in a bare star:
      # nothing would ever complete it with zero repeats) covers up to 2 spaces after the digit ("200  g old");
      # a run longer than that has never occurred in her corpus.
      - {id: "G OLD", match: "g{SEP:SP}+old", not_after: "[0123456789]{SEP:SP?}{SEP:SP?}"}
      - {id: "GO LD", match: "go{SEP:SP}+ld",                # rev 6: go ld ("gol d" is left: "gol de Messi")
         not_after: "[0123456789]{SEP:SP?}{SEP:SP?}"}
  white:
    # rev 8 (owner decision, 2026-09-25): "white" and every word starting with it - the SAME PATTERN as gold
    # (plain `match:`, kind=ban, `where: anywhere`, no continuation policy at all): the instant the 5 letters
    # w-h-i-t-e are typed, the match completes and that character is refused, regardless of what came before or
    # would follow - so whites/whiter/whitest/whiten(ed/ing/s)/whiteness/whitewash/whiteboard/Whitehall, and
    # names like "Snow White"/"White House" (bare "White" is banned outright, the same as bare "gold"), are ALL
    # banned by this one rule, with no allow_words list needed - exactly like "gold" bans "goldsmith" etc.
    # Words that only share the 4-letter prefix "whit" but diverge at the 5th letter - whit, whittle (5th
    # letter "t"), Whitney ("n"), whitish ("i"), Whitsun ("s"), whither ("h"), Whitman ("m") - never complete
    # this match at all (the 5th letter isn't "e"), so they pass untouched; no special-casing needed, same as
    # "falsify" would have passed the (cancelled) "false" ban, or "goldsmith" already passes as itself (it
    # completes THROUGH "gold", which is exactly why it's banned, not exempt).
    # allow_in_words: checked for a real word that CONTAINS "white" mid-word with an unrelated meaning (the
    # marigold/evangel pattern) - none found. No dictionary file was present on this machine
    # (/usr/share/dict/words does not exist here) to check exhaustively; reasoned through the plausible
    # candidates by hand (off-white, snow-white, lily-white, egg-white) and all of them are actual descriptions
    # of whiteness, not words with an unrelated meaning, so none belongs on an allow_in_words exemption list.
    # Flagging this in the report as a "checked, none found, but not exhaustively" case, per the task's own
    # instruction to say when a dictionary isn't available.
    rules:
      - {id: WHITE, match: white, where: anywhere}
      - {id: W-H-I-T-E, match: white, spaced: ALL}
      - {id: WHITE.SPLIT, match: white, split: SPLIT}       # wh-ite, whi·te, **W**hite, wh_ite
  flame:
    rules:
      # a word that STARTS with "flam" is banned unless it is flammable / flammability (owner: keep) or starts
      # "flamb" (flambé / flambéed: 2 real uses in her replies; flamboyant). rev 6 drops flamen, flamenco(s),
      # flamingo(s) (0 uses): each was a way for the model to be cornered after "flame". flamme / Flammen (French /
      # German) are banned.
      - {id: FLAM, stem: flam, alone: ban, other: ban, allow_prefixes: [mab, b]}
      # rev 6: "flam" inside a word (candleflame, theflames, aflame) is banned, except inflame / inflammation ...
      - {id: FLAM-IN, match: flam, where: inside,
         allow_in_words: [inflam, enflam, proinflam, antiinflam, noninflam, uninflam, nonflam]}
      - {id: F-L-A-M-E, match: flame, spaced: ALL}
      - {id: FL.AME, match: flame, split: SPLIT}           # rev 6: fl-ame, fla·me, **Fl**ame

  yellow_light:
    # rev 7 (owner decision A, 2026-09-24): "only ban [yellow/light] when used to describe 'yellow light';
    # individually the words are harmless" - the phrase is banned only when the two words are JOINED (glued,
    # a run of space/NBSP/tab/hyphen/underscore/dot/etc, a single line break, markup, or a split inside either
    # word); across a sentence/clause break (". " ", " "; " a blank line, a line break before a list marker, or
    # " + " with spaces) it PASSES. See the PJOIN/PSPLIT separators above for exactly which characters are which.
    # rev 7 FINAL (owner decision D1, 2026-09-25): "ban EVERY word starting with 'yellow light': NO carve-outs" -
    # this REPLACES decision B. lighter/lighthouse/lightning/lighting/lights are ALL banned now, glued forms
    # too, with no exception at all. Plain `match:` (kind=ban), not `stem:` - once "yellow" + JOIN + "light" is
    # spelled, the match completes and the model cannot continue it AT ALL (angel/gold-style unconditional ban).
    # This REMOVES THE FUNNEL ENTIRELY: there is no narrow "only 3 words continue" state any more, because
    # nothing continues - the ' light' token path leads nowhere and the model must pick a different word before
    # even finishing "light". The funnels.documented entry for "yellow light" is removed accordingly (below).
    # rev 7 round 2 (owner): the white_flame family was removed - "flame" is already fully, unconditionally
    # banned by the FLAM family above (any occurrence, in any context, with no separator-based escape except
    # flammable/flambe/flamboyant), so a joined/break phrase rule for "white flame" can never change any verdict
    # (every input that spells "white flame" already contains the banned word "flame" on its own). It cost a
    # real, measured 7 rules / ~15% of the grammar for zero behavioural effect - removed to bring the first
    # compile back under the tool's 120s limit (see wb_image.py's `first compile` check). The multiset `like:`
    # machinery (wordban.py `like_shape`/`like_mismatches`) is kept for a future family that actually needs it;
    # `like:` is simply not declared on any current rule.
    rules:
      - {id: YELLOWLIGHT, match: "yellow{SEP:PJOIN}*light"}
      # a single line break, optionally padded with plain spaces (poem line-wrap: "the yellow\nlight") - kept
      # separate from PJOIN (which never carries a bare newline) so a SECOND newline (a blank line, BREAK) or a
      # newline preceded by punctuation / followed by a list marker never matches this at all (see banlist
      # comment on PJOIN): those forms simply don't fit "letters, spaces, ONE newline, spaces, letters".
      - {id: YELLOWLIGHT-LINEBREAK, match: "yellow{SEP:SP}*\n{SEP:SP}*light"}
      # CRLF (\r\n) is the SAME single line break as \n, just the Windows-style two-byte form.
      - {id: YELLOWLIGHT-LINEBREAK-CRLF, match: "yellow{SEP:SP}*\r\n{SEP:SP}*light"}
      # rev 7 FINAL (item 4): a hyphen directly before a single line break ("yellow-\nlight", word-wrap after a
      # hyphenated compound; "yellow -\nlight" with a space before the hyphen too) - a separate rule from
      # YELLOWLIGHT-LINEBREAK because the hyphen is mandatory here (PJOIN's own hyphen members never combine
      # with the dedicated single-newline rule, by design - see the PJOIN comment above).
      - {id: YELLOWLIGHT-LINEBREAK-HYPHEN, match: "yellow{SEP:SP}*-{SEP:SP}*\n{SEP:SP}*light"}
      # '.' ':' ',' glued with NO surrounding space ("yellow.light", "yellow:light", "yellow,light") - the
      # space-padded forms (". " ": " ", ") are BREAK and must pass, so these punctuation marks are never put in
      # a separator SET that could combine with whitespace (fix 1).
      - {id: YELLOWLIGHT-PUNCT, match: "yellow[.:,;]light"}
      - {id: YELLOWLIGHT-SPACED, match: yellowlight, spaced: ALL}
      - {id: YELLOWLIGHT-INSIDE, match: yellowlight, where: inside}   # theyellowlight
      # a split INSIDE either word, plus a JOINED boundary between them (decision A: "a space inside 'yellow' is
      # fine to ban for this phrase specifically") - "yel-low light", "yellow lig-ht", "yel low light", and
      # (item 4) "yel-low-light"/"yel-low_light"/"yel-lowlight"/"yel-low\tlight" (outer_sep broadened from
      # SP-only to PJOIN, so the boundary after an inner split accepts the same JOIN characters as the phrase's
      # own boundary elsewhere).
      - {id: YELLOWLIGHT-WORDSPLIT, match: yellowlight, phrase_split: [yellow, light], inner_sep: PSPLIT,
         outer_sep: PJOIN, outer_optional: true}
      # rev 7 FINAL (item 4): a split inside "yellow" followed by a single line break as the boundary
      # ("yel-low\nlight") - PJOIN (used as WORDSPLIT's outer_sep above) never carries a bare newline, by
      # design, so this needs its own variant, the same way YELLOWLIGHT-LINEBREAK is split out from YELLOWLIGHT.
      - {id: YELLOWLIGHT-WORDSPLIT-NL, match: yellowlight, phrase_split: [yellow, light], inner_sep: PSPLIT,
         outer_sep: NL}
      # rev 7 FINAL (item 4): a letter-spaced run WITHIN one word only ("y-e-l-l-o-w light", "yellow
      # l-i-g-h-t") - phrase_split's own inner_sep positions already ban a SINGLE split point per word combined
      # with a JOINED boundary; a full letter-by-letter spaced run needs its own pair of rules (one per word),
      # each using PJOIN as the boundary to the OTHER, whole word.
      - {id: YELLOWLIGHT-SPACEDWORD-Y, match: yellowlight, spaced_word: yellow, spaced_set: ALL, boundary_sep: PJOIN}
      - {id: YELLOWLIGHT-SPACEDWORD-L, match: yellowlight, spaced_word: light, spaced_set: ALL, boundary_sep: PJOIN}
      # rev 7 FINAL (item 4): HTML markup wrapping ONE word specifically with a tag that contains a LETTER
      # (</b>, <i>) - these can't be generic PJOIN separator characters (the tag's own letters, e.g. "b"/"i",
      # would collide with real letter matching), so each closing/opening tag gets its own explicit literal
      # rule instead. "<b>yellow</b> light" (the leading "<b>" is irrelevant - it precedes the phrase) and
      # "yellow <i>light</i>" (the trailing "</i>" likewise). Other tags (<em>, <strong>, <u>, ...) are a
      # documented gap (tests.gaps) rather than an open-ended list of literal rules.
      - {id: YELLOWLIGHT-MARKUP-B, match: "yellow</b>{SEP:SP}*light"}
      - {id: YELLOWLIGHT-MARKUP-I, match: "yellow{SEP:SP}*<i>light"}
      # rev 7 FINAL (targeted review): markup wrapping BOTH words separately ("<b>yellow</b> <b>light</b>",
      # "<i>yellow</i> <i>light</i>") - the closing tag after "yellow" AND the opening tag before "light" both
      # appear in the boundary, which the single-sided rules above don't cover.
      - {id: YELLOWLIGHT-MARKUP-BB, match: "yellow</b>{SEP:SP}*<b>light"}
      - {id: YELLOWLIGHT-MARKUP-II, match: "yellow</i>{SEP:SP}*<i>light"}

# Words deliberately NOT banned whose use is counted in her corpus by `verify --corpus` (counts only), so a
# stand-in shows up. Python regexes over the text as written (an accented evasion is not the allowed word).
watch:
  "malakh (Hebrew for messenger; owner decision: not banned)": "(?i)(?<![^\\W\\d_])mal['’]?a['’]?k[h]?(?![^\\W\\d_])|מלאך|מַלְאָךְ"
  flamingo: "(?i)(?<![^\\W\\d_])flamingos?(?![^\\W\\d_])"
  flamenco: "(?i)(?<![^\\W\\d_])flamencos?(?![^\\W\\d_])"
  flamen: "(?i)(?<![^\\W\\d_])flamen(?![^\\W\\d_])"
  inflame / inflammation / inflammatory: "(?i)inflam[^\\W\\d_]*"
