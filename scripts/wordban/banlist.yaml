  gaps: ["ŔÙach", "Ｇｏｌｄ", "ＡＮＧＥＬ", "ǵȍld", "💔 old", "old 💔",
         # rev 6 documented: lower-case Spanish "los angeles" reads as the place name; space splits are banned for
