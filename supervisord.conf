; LOG_DIR is exported by entrypoint.sh and defaults to /data/logs — the
; network volume, NOT the container. Container-local logs died with the
; container, so every redeploy, OOM-kill or pod recreate destroyed the evidence
; for whatever caused it. The 2026-08-27 context overflows can only be recorded
; as "probable" because the failing container's logs went with it.
;
; Because these files now outlive deployments, rotation is a real bound rather
; than a formality: every stream carries an explicit _backups=3, so worst case
; is roughly 2.2 GB across the seven programs and the event listener — ten
; streams at 50MB x 4 (vllm, compactor, openwebui, stt, tts) plus six at
; 10MB x 4 (selftest, backup, processes). entrypoint.sh writes a boot marker to
; boot.log so a reader can tell where one container's history ends and the next
; begins.
[supervisord]
nodaemon=true
user=root
logfile=%(ENV_LOG_DIR)s/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; Unix socket for supervisorctl. Without this trio of sections, supervisord
; runs but supervisorctl has nothing to connect to and you can only restart
; processes by killing them and letting autorestart re-spawn them.
;
; supervisord logs `CRIT Server 'unix_http_server' running without any HTTP
; authentication checking` at every boot. Assessed for THIS deployment and
; deliberately left as-is: the server is a filesystem socket, never a TCP port
; (there is no [inet_http_server] section), chmod=0700 restricts it to its
; owner, and every process in the container — supervisord, vllm, compactor,
; openwebui, stt, tts — already runs as root. A username/password would
; therefore guard nothing that root cannot already reach, while adding a
; plaintext credential that has to be duplicated into [supervisorctl].
; Revisit if either of those premises changes: an inet_http_server section, or
; any program dropped to a non-root user.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ---------------------------------------------------------------------------
; Restart policy (V2.3 Theme 3 review)
; ---------------------------------------------------------------------------
; Long-running services below use autorestart=true + startretries=3 + a
; meaningful startsecs. The important property: a service that is GENUINELY
; BROKEN ON BOOT (e.g. vLLM OOMs because the model doesn't fit) crashes
; before startsecs elapses, which supervisord counts as a failed start;
; after startretries it transitions to FATAL and STAYS there — visible via
; `supervisorctl status`, not fast-restart-looping and hiding the root cause
; (the lesson from the V1.9.x cascade). Detection + recovery for a FATAL
; service is documented in OPERATIONS.md.
;   - startsecs : how long it must stay up to count as "started"
;   - startretries : failed starts before giving up → FATAL
;   - autorestart=true : restart if it dies AFTER a successful start
; One-shot/daemon sidecars (selftest, backup) set their own policy below.

; ---------------------------------------------------------------------------
; zl-ops: one-shot boot wiring for the baked ops/scripts tree (.8, Dockerfile
; COPY ops/ + scripts/ to /opt/zl-repo/{ops,scripts}). It is NOT part of the
; core service graph and never gates it:
;   - it ALWAYS exits 0. bootstrap.sh's own EXIT trap guarantees the exit
;     code, whatever went wrong inside; supervisord therefore never sees a
;     FATAL/BACKOFF state from this program, by design, not by luck;
;   - the truth about what actually happened is the LAST LINE of
;     $LOG_DIR/zl-ops.log (bootstrap.sh's own log), not the supervisor exit
;     code or this stanza's stdout_logfile — read that file to find out
;     whether the boot step it ran actually succeeded;
;   - it never depends on vLLM or the compactor being up, and nothing in
;     vllm/compactor/openwebui depends on it either: priority=5 only
;     controls start ORDER among one-shots/daemons that supervisord starts
;     concurrently at boot, not a gate on any other program's readiness.
[program:zl-ops]
command=/bin/bash /opt/zl-repo/ops/bootstrap.sh --from-dir /opt/zl-repo --boot
autostart=true
autorestart=false
startsecs=0
startretries=0
priority=5
stopwaitsecs=5
redirect_stderr=true
stdout_logfile=%(ENV_LOG_DIR)s/zl-ops-supervisord.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
exitcodes=0

[program:vllm]
; bash -c lets us expand $VLLM_EXTRA_ARGS at runtime — supervisord itself
; doesn't expand shell vars in command lines. Use VLLM_EXTRA_ARGS for
; --tensor-parallel-size, an offline-FP8 checkpoint, etc.
; startsecs=60: model load is slow; an OOM crash lands well inside 60s, so
; 3 retries → FATAL in ~3 min makes a too-big-model deploy fail visibly
; fast instead of looping. (On A40 use the 12B — see RUNPOD_DEPLOY.md.)
command=/bin/bash -c "exec /opt/vllm-venv/bin/python -m vllm.entrypoints.openai.api_server --model %(ENV_MODEL_REPO)s --host %(ENV_VLLM_HOST)s --port %(ENV_VLLM_PORT)s --max-model-len %(ENV_MAX_MODEL_LEN)s --gpu-memory-utilization %(ENV_GPU_MEMORY_UTILIZATION)s --enable-prefix-caching $VLLM_EXTRA_ARGS"
autostart=true
autorestart=true
priority=10
startsecs=60
startretries=3
stdout_logfile=%(ENV_LOG_DIR)s/vllm.log
stderr_logfile=%(ENV_LOG_DIR)s/vllm-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
environment=
    HF_HOME="%(ENV_HF_HOME)s",
    VLLM_EXTRA_ARGS="%(ENV_VLLM_EXTRA_ARGS)s"

[program:compactor]
; Runs in its OWN venv (/opt/compactor-venv), decoupled from vLLM as of
; V2.0 Phase 3 so chromadb/fastembed can't disturb vLLM's torch pins.
command=/opt/compactor-venv/bin/uvicorn main:app
    --host %(ENV_COMPACTOR_HOST)s
    --port %(ENV_COMPACTOR_PORT)s
    --log-level info
directory=/opt/compactor
autostart=true
autorestart=true
priority=15
startsecs=10
startretries=3
stdout_logfile=%(ENV_LOG_DIR)s/compactor.log
stderr_logfile=%(ENV_LOG_DIR)s/compactor-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
; Only HF_HOME is listed explicitly (the tokenizer cache location must be
; right). Every other COMPACTOR_*/RAG/FASTEMBED var is inherited from the
; container environment (Dockerfile ENV defaults, overridable via .env or
; the RunPod template) — supervisord children inherit the parent env, so
; listing them here would be redundant AND risk a crash if one were unset.
environment=
    HF_HOME="%(ENV_HF_HOME)s",
    MODEL_REPO="%(ENV_MODEL_REPO)s",
    VLLM_URL="%(ENV_VLLM_URL)s"

[program:webuidb-sync]
; Publishes the LOCAL webui.db back to /data on a timer, so the pod being
; recreated costs at most WEBUI_DB_SYNC_INTERVAL_S of chat history. Uses
; sqlite3's backup API (safe against a live database), verifies the image
; before it replaces the previous snapshot, and skips entirely when nothing
; has changed - each publish writes the whole database onto the volume whose
; write reliability is the problem this exists to route around.
;
; D1 (findings.md, 2026-09-23 rehearsal). priority USED TO be 25 (after
; openwebui=20), with the comment "after OpenWebUI, because there is
; nothing to publish until it has created or opened the database" - true
; for STARTUP, but supervisord uses the SAME number for both directions:
; "lower priorities start first and shut down LAST" (supervisord's own
; docs, verbatim). At 25 > 20 this program shut down BEFORE openwebui on
; every `supervisorctl stop`, `docker stop` or redeploy - the opposite of
; what a final sync needs, and a publish (13-23s warm) is longer than
; RunPod's grace period regardless.
;
; Now 19 (< openwebui's 20): starts BEFORE openwebui (after compactor=15),
; which is fine - webuidb.py's own sync_loop() runs its first sync_once()
; immediately (D11/D14 fix) and sync_once() already treats "LOCAL_DB does
; not exist yet" as an ordinary skip, never an error, so starting ahead of
; the database being created costs nothing. And it now shuts down AFTER
; openwebui - which is the entire point: webuidb.py's SIGTERM handler
; (D1) runs one last sync_once(force=True) on the way out, publishing
; whatever OpenWebUI just wrote before IT stopped. stopwaitsecs=120 gives
; that final sync (measured 13-23s warm, up to ~71s cold) room to finish
; before supervisord gives up and SIGKILLs it.
command=/opt/compactor-venv/bin/python /opt/compactor/webuidb.py
directory=/opt/compactor
; AUTOSTART FOLLOWS THE GATE, not a constant. entrypoint.sh exports
; WEBUIDB_SYNC_ENABLED from WEBUI_DB_LOCAL and always exports it, because
; supervisord dies at startup on an %(ENV_x)s it cannot resolve.
;
; With the gate off this program publishing anything would overwrite the
; LIVE database with a stale local copy - see the entrypoint block.
autostart=%(ENV_WEBUIDB_SYNC_ENABLED)s
autorestart=true
priority=19
startsecs=5
stopwaitsecs=120
stdout_logfile=%(ENV_LOG_DIR)s/webuidb-sync.log
stderr_logfile=%(ENV_LOG_DIR)s/webuidb-sync-error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

[program:openwebui]
command=/app/venv/bin/open-webui serve --host 0.0.0.0 --port %(ENV_OPENWEBUI_PORT)s
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=10
startretries=3
stdout_logfile=%(ENV_LOG_DIR)s/openwebui.log
stderr_logfile=%(ENV_LOG_DIR)s/openwebui-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
environment=
    HOME="/app",
    DATA_DIR="%(ENV_DATA_DIR)s",
    WEBUI_SECRET_KEY="%(ENV_WEBUI_SECRET_KEY)s",
    OPENAI_API_BASE_URL="%(ENV_OPENAI_API_BASE_URL)s",
    OPENAI_API_KEY="%(ENV_OPENAI_API_KEY)s",
    ENABLE_OLLAMA_API="%(ENV_ENABLE_OLLAMA_API)s",
    ENABLE_OPENAI_API="%(ENV_ENABLE_OPENAI_API)s",
    WEBUI_AUTH="%(ENV_WEBUI_AUTH)s"

# v3.1.9.9: Cloudflare Tunnel, so her OpenWebUI is reachable at
# https://ai.revelationsaints.com instead of (alongside, during the
# transition) the RunPod proxy URL. See RUNBOOK_CLOUDFLARE_TUNNEL.md and
# docker/cloudflared-run.sh (this program's actual command, baked to
# /opt/cloudflared-run.sh) for the full design.
#
# DISABLED-BY-DEFAULT, config-gated on CLOUDFLARE_TUNNEL_TOKEN (a RunPod
# secret), NOT on an `autostart=` boolean expansion like STT_ENABLED/
# TTS_ENABLED/COMPACTOR_*_ENABLED above — those all crash supervisord's
# CONFIG LOAD if the var is unset (entrypoint.sh's own "BEGIN SUPERVISORD
# BOOL NORMALIZATION" block exists precisely to always export a concrete
# true/false into every one of them before `exec supervisord` runs). A
# secret token has no such safe default to normalize to, so this program
# instead ALWAYS autostarts (like compactor/openwebui/vllm) and
# cloudflared-run.sh itself is what checks whether the token is present —
# see that script's own header for why it exits 0 (not `sleep infinity`)
# when it is absent.
#
# priority=21: after openwebui(20) — the tunnel serves OpenWebUI, so it
# makes sense for it to come up after there is something at localhost:3000
# to forward to, though cloudflared itself tolerates the backend not being
# up yet (it retries the connection to the origin, not just the edge) — and
# before stt(25)/tts(26), which are unrelated. Lower than webuidb-sync(19),
# same as everywhere else in this file: priority only orders concurrent
# boot/shutdown among peers, it is not a readiness gate (see the
# [program:zl-ops] comment above for the fuller version of this point).
#
# autorestart=unexpected + exitcodes=0: an exit 0 (no token — "disabled") is
# EXPECTED and is NOT restarted, so a disabled tunnel settles into EXITED
# and stays there — `supervisorctl status` then reads
# "cloudflared EXITED (expected)", a config choice made visible, not a
# crash. Any OTHER exit (cloudflared itself erroring out, e.g. on a killed
# process or an unhandled panic) is UNEXPECTED and IS restarted, same as
# vllm/compactor/openwebui's plain autorestart=true — it just also carries
# the "0 is fine, don't restart on that" carve-out those don't need.
#
# startsecs=0, NOT 1 — proven by an actual boot, not just reasoned about.
# A startsecs=1 first draft of this stanza was booted (rc-boot-test-v3199.sh)
# with NO token and went FATAL, not EXITED: supervisord's state machine
# judges an exit AGAINST exitcodes/autorestart only once startsecs has been
# survived; a process that exits (however cleanly, however deliberately
# exitcodes=0 marks it as "expected") BEFORE startsecs elapses is instead
# scored as a START FAILURE — that path ignores exitcodes entirely, retries
# up to startretries, and lands on FATAL, exactly what happened. The
# disabled path's exit 0 is well under any positive startsecs, so ANY
# positive value reproduces this trap. startsecs=0 is what
# [program:zl-ops]/[program:selftest] already use for the same reason
# (see [program:zl-ops]'s own comment) — with it, supervisord counts the
# process as started the instant it spawns, so BOTH the disabled path
# (exit 0 -> EXITED, expected, no restart) and the enabled-but-bad-token
# path (a nonzero exit -> EXITED, unexpected -> autorestart='unexpected'
# restarts it) are judged by exitcodes/autorestart as intended, and FATAL
# (a start-failure verdict) is no longer reachable from either. Re-verified
# by re-running the same boot test after this fix: both paths land where
# this comment says (see the runbook / boot-test log for the confirmed run).
#
# startretries=5: mostly VESTIGIAL with startsecs=0 (the BACKOFF/FATAL path
# this guards needs a process that fails to even SPAWN — e.g. the binary
# missing or unreadable — not one that spawns and exits, which startsecs=0
# always counts as a successful start). Left set, higher than vllm/
# compactor/openwebui's startretries=3, as a harmless bound for that
# narrower case: cloudflared is one more binary that could theoretically be
# missing/corrupted after a bad layer, and there is no reason to accept
# fewer retries for it than for anything else in this file.
#
# stopwaitsecs=10: cloudflared's own graceful-shutdown drain on SIGTERM is
# fast (closing edge connections, no in-flight state to flush like
# webuidb-sync's final sync) — long enough to not SIGKILL a clean shutdown,
# short enough not to hold up `docker stop`/a redeploy.
[program:cloudflared]
command=/bin/bash /opt/cloudflared-run.sh
directory=/opt
autostart=true
autorestart=unexpected
exitcodes=0
priority=21
startsecs=0
startretries=5
stopwaitsecs=10
stdout_logfile=%(ENV_LOG_DIR)s/cloudflared.log
stderr_logfile=%(ENV_LOG_DIR)s/cloudflared-error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
; CLOUDFLARE_TUNNEL_TOKEN is deliberately NOT listed here (and must never
; be): an `environment=` line here would put the token in supervisord's own
; config-derived process table, the same visibility class this whole
; script exists to avoid for argv, AND a %(ENV_CLOUDFLARE_TUNNEL_TOKEN)s
; reference would crash supervisord's config load outright when the var is
; unset (unlike %(ENV_x)s booleans, an operator-facing secret is never
; guaranteed to be set — see entrypoint.sh's own "BEGIN SUPERVISORD BOOL
; NORMALIZATION" comment for the general hazard this is the secret-shaped
; version of). cloudflared-run.sh (this program's command) is a supervisord
; child and so already inherits the FULL container environment, the same
; way [program:compactor] inherits every COMPACTOR_* var without listing
; them — nothing needs to be forwarded by hand.

# V3.2: Whisper speech-to-text service. Runs in its OWN venv (/opt/whisper-venv)
# on STT_PORT (9000). OpenWebUI's STT engine posts audio here; the compactor is
# NOT involved (audio -> text only — transcribed text then flows through the
# compactor like any typed message). CPU by default (server.py) so it never
# competes with vLLM for VRAM. Disable the whole service per-pod with
# STT_ENABLED=false. priority=25 puts it after openwebui(20), before selftest(30)
# so the boot self-test's STT check finds it already up.
[program:stt]
command=/opt/whisper-venv/bin/python /opt/stt/server.py
directory=/opt/stt
autostart=%(ENV_STT_ENABLED)s
autorestart=true
priority=25
startsecs=10
startretries=3
stdout_logfile=%(ENV_LOG_DIR)s/stt.log
stderr_logfile=%(ENV_LOG_DIR)s/stt-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
; All WHISPER_*/STT_* config is read from the inherited container environment
; (Dockerfile ENV defaults, overridable via .env / RunPod template). Not listed
; here so an unset var can't crash supervisord's config load.

# V3.3: Piper text-to-speech service. Own venv (/opt/tts-venv) on TTS_PORT
# (9001). OpenWebUI's TTS engine posts text here and plays the returned audio;
# the compactor is NOT involved. CPU + torch-free. Disable per-pod with
# TTS_ENABLED=false. priority=26 (after stt=25, before selftest=30).
[program:tts]
command=/opt/tts-venv/bin/python /opt/tts/server.py
directory=/opt/tts
autostart=%(ENV_TTS_ENABLED)s
autorestart=true
priority=26
startsecs=10
startretries=3
stdout_logfile=%(ENV_LOG_DIR)s/tts.log
stderr_logfile=%(ENV_LOG_DIR)s/tts-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
; All TTS_* config is read from the inherited container environment (Dockerfile
; ENV defaults). Not listed here so an unset var can't crash the config load.

# V2.1 Phase 6 Step 2: boot-time self-test.
# One-shot: runs once after vllm/compactor/openwebui are up, logs PASS/FAIL
# to /var/log/supervisor/selftest.log, then exits. Failure does NOT take
# down the pod — but it is now recorded as an abnormal exit (see exitcodes
# below), so the operator's next observability check can distinguish it.
# Disable per-pod via COMPACTOR_SELFTEST_ON_BOOT=false.
# priority=30 puts it after vllm(10), compactor(15), openwebui(20).
[program:selftest]
command=/opt/compactor-venv/bin/python /opt/compactor/selftest.py --on-boot --wait-for-ready
directory=/opt/compactor
priority=30
autostart=%(ENV_COMPACTOR_SELFTEST_ON_BOOT)s
autorestart=false
startsecs=0
startretries=0
# 0 only. `exitcodes=0,1` made a self-test FAILURE an *expected* exit, so
# supervisord logged it identically to a pass and the PROCESS_STATE_EXITED
# event carried expected=1 — nothing downstream could tell the two apart.
# selftest.py exits 1 on failure; that is now abnormal and says so.
# (v3.1 P0-1 / F13.) NOTE: this makes the failure visible, not loud. With
# autorestart=false the state is still EXITED; the outbound signal is
# COMPACTOR_ALERT_WEBHOOK, which is unset — see runpod.env.template.
exitcodes=0
stdout_logfile=%(ENV_LOG_DIR)s/selftest.log
stderr_logfile=%(ENV_LOG_DIR)s/selftest-error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
; STORAGE_ROOT intentionally NOT set here — memory.py defaults to
; /data/openwebui/compactor when COMPACTOR_STORAGE_ROOT is unset, and
; supervisord would crash on config load if we referenced an unset env.
environment=
    COMPACTOR_URL="http://127.0.0.1:%(ENV_COMPACTOR_PORT)s",
    VLLM_URL="http://%(ENV_VLLM_HOST)s:%(ENV_VLLM_PORT)s",
    MODEL_REPO="%(ENV_MODEL_REPO)s"

# V2.3 Theme 1: periodic data-durability backups.
# Long-running daemon: snapshots webui.db + the compactor memory store on a
# fixed interval, verifies each archive (PRAGMA integrity_check + JSON
# parse), prunes to retention, logs to /var/log/supervisor/backup.log. A
# failed cycle is logged and the daemon keeps running. Disable per-pod via
# COMPACTOR_BACKUP_ENABLED=false. priority=40 (after selftest=30).
[program:backup]
command=/opt/compactor-venv/bin/python /opt/compactor/backup.py --daemon
directory=/opt/compactor
priority=40
autostart=%(ENV_COMPACTOR_BACKUP_ENABLED)s
autorestart=true
startsecs=5
stdout_logfile=%(ENV_LOG_DIR)s/backup.log
stderr_logfile=%(ENV_LOG_DIR)s/backup-error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
; All other backup config (dir, interval, retain, db path) is read from the
; environment by backup.py with sane defaults — not referenced here, so an
; unset var can't crash supervisord's config load.
environment=
    DATA_DIR="%(ENV_DATA_DIR)s"

# Process-state recorder. What this section used to be, verbatim:
#   command=/bin/bash -c "echo READY && while read line; do echo OK; done"
# Three protocol violations, the first of them fatal:
#   1. The ack must be `RESULT <len>\n<body>` — supervisor/childutils.py's
#      listener.ok() writes exactly "RESULT 2\nOK". A bare `OK` is a bad result
#      line, and dispatchers.py answers a bad result line by moving the
#      listener to UNKNOWN ("has entered the UNKNOWN state and will no longer
#      receive events").
#   2. It never read the event PAYLOAD. `read line` consumes the header only,
#      so the body was still queued where the next header was expected.
#   3. It sent READY once, not once per event — even a well-formed version
#      would have handled exactly one.
# UNKNOWN is terminal, and _dispatchEvent (process.py) only delivers to a
# listener whose state is READY. So from 2 seconds after boot the pool
# buffered every PROCESS_STATE event, reached buffer_size, and dropped the
# oldest on each new one — the `ERRO pool processes event buffer overflowed`
# records that span the whole 2026-08-24 run, the only ERRO records in that
# bundle. Both compactor SIGTERMs were discarded that way, which is why the
# incident had no process-transition timeline to read.
#
# The loop below speaks the protocol: READY, read the header, read exactly the
# header's `len:` bytes of payload, "RESULT 2\nOK", repeat. It is a RECORDER,
# not an alerter — the outbound failure signal is COMPACTOR_ALERT_WEBHOOK
# (alert.py, used by selftest and backup). This exists so that "which process
# changed state, when" survives the container it happened in.
[eventlistener:processes]
command=/bin/bash -c 'while printf "READY\n"; do IFS= read -r header || exit 0; len="${header##*len:}"; case "$len" in ""|*[!0-9]*) len=0;; esac; body=""; [ "$len" -gt 0 ] && IFS= read -r -N "$len" body; echo "$(date -u -Iseconds) $header $body" >&2; printf "RESULT 2\nOK"; done'
events=PROCESS_STATE
; Headroom for the burst a boot or a full restart produces — every program
; walks STARTING -> RUNNING, and a crash-looping one adds BACKOFF/STARTING/
; FATAL on top. The buffer only grows while the listener is not consuming, so
; with the fix above it should stay near empty; the point of the larger bound
; is that overflow's only symptom is the ERRO line and the missing event, and
; the missing event is the evidence you went looking for.
buffer_size=100
; An eventlistener's default priority is -1 (options.py), i.e. started before
; every program — which is what we need, since it has to be READY before
; vllm's first transition. Stated rather than inherited so a later edit can't
; quietly reorder it.
priority=-1
autostart=true
autorestart=true
; startsecs=0, unlike every program above, and measured rather than guessed:
; _dispatchEvent skips a listener whose process state is not RUNNING, and
; startsecs is exactly how long supervisord waits before calling it RUNNING.
; At startsecs=5 a test run buffered the first ten transitions — the entire
; boot burst — and released them together about five seconds late, so every
; one of them carried the time the listener drained it rather than the time it
; happened. At 0 they arrive as they occur. The timestamp below is still the
; listener's receipt time; supervisord.log remains the authority on ordering.
startsecs=0
; Named for CONTENT, not for stream. supervisord forces an eventlistener's
; stdout to carry the protocol (options.py: stderr is never redirected into it
; for exactly that reason), so the readable transition record has to come out
; on stderr. Calling that file "-error" would repeat the v3.1 P0-2 mistake of
; hiding the operational log where an operator won't look. Both are under
; LOG_DIR now; previously neither was set, so AUTO put them in the container's
; own /tmp and every redeploy took them with it.
stdout_logfile=%(ENV_LOG_DIR)s/process-events-protocol.log
stderr_logfile=%(ENV_LOG_DIR)s/process-events.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
