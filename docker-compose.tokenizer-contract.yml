# Tokenizer-contract test stack. SEPARATE from docker-compose.yml (production,
# GPU, model weights) on purpose — nothing here touches that file or its stack.
#
#   docker compose -f docker-compose.tokenizer-contract.yml up --build --exit-code-from contract-tests
#
# See testfixtures/tokenizer-contract/README.md for what this proves and, more
# importantly, what it does not.

services:
  tokenize-fixture:
    build:
      context: ./testfixtures/tokenizer-contract
      dockerfile: Dockerfile
    container_name: zla-tokenize-fixture
    environment:
      # Small, byte-level BPE, carries a chat_template. NOT Cydonia's
      # tokenizer — the absolute counts here mean nothing for production.
      FIXTURE_TOKENIZER: HuggingFaceTB/SmolLM2-135M-Instruct
      FIXTURE_SERVED_MODEL_NAME: fixture-model
      FIXTURE_MAX_MODEL_LEN: "32768"
      # "v010" = the wording vllm 0.10.0 actually emits (verified from the CPU
      # release image). "legacy" = the older wording main._CTX_OVERFLOW_RE is
      # written against. Both are tested; see test_tokenizer_contract.py.
      FIXTURE_ERROR_STYLE: v010
    ports:
      # Published so the fixture can be curl'd by hand from the host during
      # development. The test container talks to it over the compose network.
      - "18000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  contract-tests:
    build:
      context: ./testfixtures/tokenizer-contract
      dockerfile: Dockerfile.testrunner
    container_name: zla-contract-tests
    depends_on:
      tokenize-fixture:
        condition: service_healthy
    environment:
      VLLM_URL: http://tokenize-fixture:8000
      MODEL_REPO: fixture-model
      FIXTURE_URL: http://tokenize-fixture:8000
      # The LOCAL tokenizer the compactor should use, distinct from the
      # server's. Set to "" to test the char/4 estimator regime instead.
      CONTRACT_LOCAL_TOKENIZER: gpt2
      MAX_MODEL_LEN: "32768"
      COMPACTOR_GENERATION_RESERVE: "16384"
    volumes:
      # Read-only: these tests must not be able to mutate the repo.
      - ./:/repo:ro
    working_dir: /repo/compactor

  # The soak's OWN fixture. Identical config, separate container.
  #
  # It used to depend on tokenize-fixture, one service shared with the
  # contract suite, and the comment below claimed isolation the file did not
  # implement. `up --profile soak` starts both suites against that one
  # fixture, and the contract suite deliberately injects /tokenize 400s and
  # malformed 200s into it — so the soak failed at turn 12 with
  # "'/tokenize degraded' appeared". A real-looking red, caused entirely by
  # the harness. Exactly the failure the comment warned about, in the
  # configuration the comment was attached to.
  soak-fixture:
    profiles: ["soak"]
    build:
      context: ./testfixtures/tokenizer-contract
      dockerfile: Dockerfile
    container_name: zla-soak-fixture
    environment:
      FIXTURE_TOKENIZER: HuggingFaceTB/SmolLM2-135M-Instruct
      FIXTURE_SERVED_MODEL_NAME: fixture-model
      FIXTURE_MAX_MODEL_LEN: "32768"
      FIXTURE_ERROR_STYLE: v010
    ports:
      # 18001, not 18000: both fixtures must be able to run at once.
      - "18001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # The soak owns its dependency rather than borrowing a shared one.
  #
  # Running the contract harness with --exit-code-from tears the WHOLE stack
  # down when its container exits, including tokenize-fixture. Two suites
  # sharing one fixture therefore kill each other, and the symptom is a soak
  # failing mid-conversation with a connection error that looks exactly like a
  # real defect. A test that fails for an environmental reason indistinguishable
  # from a real one is how a suite teaches people to ignore red.
  #
  # Either of these is now safe, including the second, which starts both
  # suites side by side:
  #
  #   docker compose -f docker-compose.tokenizer-contract.yml run --rm --build soak-tests
  #   docker compose -f docker-compose.tokenizer-contract.yml --profile soak up --build
  soak-tests:
    profiles: ["soak"]
    build:
      context: ./testfixtures/tokenizer-contract
      dockerfile: Dockerfile.testrunner
    container_name: zla-soak-tests
    depends_on:
      soak-fixture:
        condition: service_healthy
    environment:
      VLLM_URL: http://soak-fixture:8000
      FIXTURE_URL: http://soak-fixture:8000
      MODEL_REPO: fixture-model
      # A small window so compaction fires within a soak-sized run. The soak
      # asserts RATIOS and lag, never absolute token counts.
      SOAK_MAX_MODEL_LEN: "8192"
      SOAK_GENERATION_RESERVE: "2048"
      SOAK_TURNS: "22"
      # No network on the budgeting path: get_tokenizer resolves MODEL_REPO
      # against huggingface.co and a 429 blocked a real run for 231 seconds.
      # (REMEDIATION F33 composing with F25.)
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./:/repo:ro
    working_dir: /repo/compactor
    command: ["python", "test_soak_conversation.py"]
